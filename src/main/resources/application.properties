# Pedidos360 - ms-login (desarrollo local)
server.port=8083

# Sin base de datos: el unico rol del servicio es decodificar el JWT de Azure AD
# y devolver los datos del usuario (oid, nombre, correo, roles, scopes).

# Azure AD - issuer-uri (no hardcodear). Define AZURE_TENANT_JWKS_URI en tu .env local.
# Ej: https://login.microsoftonline.com/${TENANT_ID}/v2.0
# Si no esta definida, SecurityConfig usa un decoder perezoso para que los tests
# y el arranque local funcionen sin tenant real (401 sin tocar red).
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AZURE_TENANT_JWKS_URI:https://login.microsoftonline.com/common/v2.0}
