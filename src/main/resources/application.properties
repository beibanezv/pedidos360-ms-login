# Pedidos360 - ms-login (desarrollo local)
server.port=8083

# Sin base de datos: el unico rol del servicio es decodificar el JWT de Azure AD
# y devolver los datos del usuario (oid, nombre, correo, roles, scopes).

# Azure AD estilo visto en clase: issuer-uri base + tenant-id (no hardcodear).
# Local: tenant 'common' (sin fetch en startup; sin token -> 401 sin tocar red).
# Real: define AZURE_TENANT_ID con el Directory (tenant) ID del portal.
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/
azure.tenant-id=${AZURE_TENANT_ID:common}
